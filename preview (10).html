<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex - Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: url("bg.png") center center / cover no-repeat;
      position: relative;
    }

    /* Dark overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .content {
      max-width: 800px;
      color: white;
      transform: translateY(60px);
    }

    h1 {
      font-size: 72px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 25px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    p {
      font-size: 22px;
      line-height: 1.5;
      font-style: italic;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    a {
      display: inline-block;
      margin-top: 18px;
      font-size: 22px;
      color: #2f7dff;
      font-weight: bold;
      text-decoration: underline;
      transition: 0.2s ease;
    }

    a:hover {
      color: #6aa2ff;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
      }

      p,
      a {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="content">
      <h1>COMING SOON...</h1>

      <p>
        The official Vortex website is currently under development at this
        moment. We appreciate the understanding and support from all of our
        members. Join our Discord now for more updates:
      </p>

      <a href="https://discord.gg/9ZvWGECzsk" target="_blank">
        https://discord.gg/9ZvWGECzsk
      </a>
    </div>
  </div>
</body>
</html>
